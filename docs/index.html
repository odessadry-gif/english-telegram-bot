<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Word Rush — Daily English</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg-1:#03050f;
  --glass-bg:rgba(10,20,50,.55);
  --glass-border:rgba(80,130,255,.18);
  --glass-shine:rgba(255,255,255,.06);
  --text:#f0f4ff;
  --text-dim:rgba(180,200,255,.55);
  --electric:#4d8dff;
  --green:#00e676;
  --red:#ff4d6d;
  --gold:#ffd740;
}

body{
  background:var(--bg-1);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:18px 12px;
  font-family:'Space Grotesk',sans-serif;
  position:relative;overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 20%, rgba(15,40,120,.5) 0%, transparent 70%),
    radial-gradient(ellipse 500px 500px at 80% 70%, rgba(8,25,80,.4) 0%, transparent 70%),
    radial-gradient(ellipse 300px 300px at 50% 50%, rgba(20,50,150,.2) 0%, transparent 70%);
  pointer-events:none;z-index:0;
}
body>*{position:relative;z-index:1}

.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid var(--glass-border);
  box-shadow:0 8px 32px rgba(0,0,0,.5),0 1px 0 var(--glass-shine) inset,0 0 0 1px rgba(255,255,255,.03) inset;
}

/* APP SHELL */
.shell{
  width:375px;
  background:linear-gradient(180deg,#060b1a 0%, #03050f 100%);
  border-radius:34px;
  border:1.5px solid rgba(60,100,200,.2);
  overflow:hidden;
  box-shadow:0 50px 100px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04), 0 0 60px rgba(15,50,150,.15);
}

.app-top{
  padding:12px 16px;
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid rgba(50,80,180,.15);
  background:rgba(5,10,28,.9);
  backdrop-filter:blur(20px);
}
.app-title{
  font-size:12px;font-weight:800;letter-spacing:2px;
  color:rgba(240,244,255,.9);
}

.main{
  padding:16px 12px;
  min-height:620px;
  display:flex;flex-direction:column;gap:12px;
}

.page-label{
  font-size:10px;color:rgba(77,141,255,.5);
  text-align:center;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:600;
}

.card{
  border-radius:20px;overflow:hidden;
  animation:fadeUp .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* LOBBY */
.lobby{padding:24px 20px;text-align:center}
.logo{
  width:80px;height:80px;border-radius:22px;margin:0 auto 14px;
  background:linear-gradient(135deg, rgba(30,79,196,.4), rgba(10,30,90,.6));
  border:1px solid rgba(77,141,255,.3);
  display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:0 0 30px rgba(30,79,196,.3), 0 0 60px rgba(30,79,196,.1);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.h1{
  font-size:26px;font-weight:800;
  background:linear-gradient(135deg,#fff 30%, #6da8ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-.5px;margin-bottom:4px;
}
.sub{font-size:13px;color:var(--text-dim);margin-bottom:18px}
.rules{
  background:rgba(20,40,100,.28);
  border:1px solid rgba(77,141,255,.14);
  border-radius:14px;padding:14px 16px;text-align:left;margin-bottom:18px
}
.rule{font-size:13px;color:rgba(200,215,255,.85);padding:5px 0;display:flex;gap:8px;align-items:center}
.rule b{color:var(--electric);font-weight:700}
.btn{
  width:100%;
  background:linear-gradient(135deg,#1e4fc4,#0d2a7a);
  border:1px solid rgba(100,160,255,.3);
  border-radius:14px;padding:14px;
  font-size:15px;font-weight:700;color:#fff;
  cursor:pointer;font-family:inherit;
  transition:all .18s;letter-spacing:.3px;
  box-shadow:0 4px 20px rgba(30,79,196,.4), 0 1px 0 rgba(255,255,255,.1) inset;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(30,79,196,.55)}

/* COUNTDOWN */
.countdown{padding:52px 20px;text-align:center}
.ring{
  width:120px;height:120px;border-radius:50%;margin:0 auto 16px;
  background:rgba(20,40,100,.4);
  border:2px solid rgba(77,141,255,.3);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(30,79,196,.3), 0 0 80px rgba(30,79,196,.1);
}
.big{
  font-size:64px;font-weight:800;
  background:linear-gradient(135deg,#fff,#6da8ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:scalePop .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes scalePop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.small{font-size:14px;color:var(--text-dim);letter-spacing:.5px}

/* GAME */
.game{padding:16px 18px}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.counter{font-size:11px;color:var(--text-dim);letter-spacing:.8px;text-transform:uppercase;font-weight:600}
.timer{
  font-family:'JetBrains Mono',monospace;
  font-size:22px;font-weight:600;color:var(--gold);
  text-shadow:0 0 12px rgba(255,215,64,.35);
}
.timer.urgent{color:var(--red);text-shadow:0 0 12px rgba(255,77,109,.45);animation:blink .6s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.bar{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-bottom:14px}
.fill{height:100%;background:linear-gradient(90deg,#1e4fc4,#4d8dff);border-radius:2px;transition:width .25s linear;box-shadow:0 0 8px rgba(77,141,255,.5)}
.fill.urgent{background:linear-gradient(90deg,#c41e3a,#ff4d6d);box-shadow:0 0 8px rgba(255,77,109,.45)}

.badge{
  display:inline-flex;gap:6px;align-items:center;
  background:rgba(0,230,118,.10);
  border:1px solid rgba(0,230,118,.22);
  border-radius:20px;padding:4px 12px;
  font-size:12px;font-weight:800;color:var(--green);
  box-shadow:0 0 12px rgba(0,230,118,.08);
}
.badge .delta{font-size:11px;font-weight:700;color:rgba(0,230,118,.7)}

.clue{
  background:rgba(15,30,70,.5);
  border:1px solid rgba(77,141,255,.15);
  border-radius:14px;padding:13px 14px;margin:12px 0 14px;
}
.clue .label{
  font-size:10px;color:rgba(77,141,255,.6);
  text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:7px
}
.clue .text{font-size:13px;color:rgba(200,215,255,.92);line-height:1.6}

.word{
  display:flex;gap:5px;justify-content:center;flex-wrap:wrap;
  margin-bottom:14px;
}
.box{
  width:34px;height:40px;border-radius:9px;
  background:rgba(10,20,55,.7);
  border:1.5px solid rgba(77,141,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:17px;font-weight:700;color:var(--text);
}
.box.empty{border-style:dashed;opacity:.45}
.box.hint{border-color:rgba(255,215,64,.5);color:var(--gold);background:rgba(255,215,64,.08)}
.box.correct{border-color:rgba(0,230,118,.5);color:var(--green);background:rgba(0,230,118,.10);box-shadow:0 0 14px rgba(0,230,118,.18)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.opt{
  background:rgba(10,22,60,.7);
  border:1.5px solid rgba(77,141,255,.18);
  border-radius:12px;padding:12px 10px;
  font-size:13px;font-weight:700;
  color:rgba(200,215,255,.92);
  cursor:pointer;transition:all .16s;
  font-family:inherit;text-align:center;
  backdrop-filter:blur(8px);
}
.opt:hover{border-color:rgba(77,141,255,.45);background:rgba(20,50,130,.5);color:#fff;transform:translateY(-1px);box-shadow:0 4px 16px rgba(30,79,196,.22)}
.opt.correct{border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.10);color:var(--green);box-shadow:0 0 20px rgba(0,230,118,.18)}
.opt.wrong{border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.10);color:var(--red)}
.opt.disabled{opacity:.35;pointer-events:none}

.hintbtn{
  width:100%;
  background:transparent;
  border:1px dashed rgba(255,215,64,.25);
  border-radius:10px;padding:9px;
  font-size:12px;font-weight:800;
  color:rgba(255,215,64,.55);
  cursor:pointer;font-family:inherit;
  transition:all .18s;letter-spacing:.3px;
}
.hintbtn:hover{border-color:rgba(255,215,64,.5);color:var(--gold);background:rgba(255,215,64,.05)}

/* RESULTS */
.results{padding:22px 20px;text-align:center}
.trophy{
  width:80px;height:80px;border-radius:22px;margin:0 auto 14px;
  background:linear-gradient(135deg, rgba(255,215,64,.2), rgba(255,150,0,.1));
  border:1px solid rgba(255,215,64,.3);
  display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:0 0 30px rgba(255,215,64,.2), 0 0 60px rgba(255,150,0,.1);
}
.rtitle{
  font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#fff 30%, #ffd740 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px
}
.rsub{font-size:13px;color:var(--text-dim);margin-bottom:16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sbox{
  background:rgba(10,20,55,.6);
  border:1px solid rgba(77,141,255,.15);
  border-radius:14px;padding:12px 6px;
}
.sval{font-size:24px;font-weight:900;color:var(--electric)}
.sval.gold{color:var(--gold);text-shadow:0 0 12px rgba(255,215,64,.25)}
.sval.green{color:var(--green);text-shadow:0 0 12px rgba(0,230,118,.25)}
.slabel{font-size:10px;color:var(--text-dim);margin-top:3px;letter-spacing:.5px}

.lb{
  background:rgba(8,16,45,.7);
  border:1px solid rgba(77,141,255,.15);
  border-radius:14px;padding:14px;text-align:left;
  backdrop-filter:blur(12px);
  margin-bottom:14px;
}
.lb .ttl{
  font-size:10px;color:rgba(77,141,255,.5);
  text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:12px;
}
.lb .row{
  display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid rgba(50,80,180,.12);
  font-size:13px;color:rgba(200,215,255,.85);
}
.lb .row:last-child{border-bottom:none}
.rank{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text-dim);width:18px;font-size:12px}
.rank.gold{color:var(--gold)}
.name{flex:1;font-weight:600}
.pts{font-weight:900;color:var(--electric);font-size:13px}

.btn-green{
  width:100%;
  background:linear-gradient(135deg, rgba(0,180,90,.8), rgba(0,130,60,.9));
  border:1px solid rgba(0,230,118,.3);
  border-radius:14px;padding:14px;
  font-size:15px;font-weight:900;color:#fff;
  cursor:pointer;font-family:inherit;
  transition:all .18s;letter-spacing:.3px;
  box-shadow:0 4px 20px rgba(0,180,90,.28), 0 1px 0 rgba(255,255,255,.1) inset;
}
.btn-green:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(0,230,118,.32)}

@media (max-width:420px){
  body{padding:0}
  .shell{width:100%;border-radius:0;min-height:100vh}
  .main{min-height:calc(100vh - 48px)}
}
</style>
</head>
<body>

<div class="shell">
  <div class="app-top">
    <div class="app-title">WORD RUSH</div>
  </div>
  <div class="main" id="main"></div>
</div>

<!-- Telegram WebApp SDK FIRST -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="./config.js"></script>
<script src="./questions.js"></script>
<script type="module" src="./app.js"></script>

</body>
</html>
