<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Travel Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #87CEEB;
    --deep: #1a3a5c;
    --gold: #FFD93D;
    --coral: #FF6B6B;
    --mint: #6BCB77;
    --cream: #FFF8EE;
    --stamp: #c0392b;
  }

  body {
    min-height: 100dvh;
    font-family: 'DM Sans', sans-serif;
    background: var(--sky);
    overflow-x: hidden;
    position: relative;
  }

  /* ===== animated sky background ===== */
  .sky-bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg, #5ba3d9 0%, #a8d8ea 45%, #fde8c8 100%);
    overflow: hidden;
  }

  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.75;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud.c1 { width:120px; height:40px; top:12%; animation-duration:28s; animation-delay:-5s; }
  .cloud.c1::before { width:60px; height:60px; top:-30px; left:15px; }
  .cloud.c1::after { width:45px; height:45px; top:-20px; left:55px; }

  .cloud.c2 { width:80px; height:28px; top:30%; animation-duration:20s; animation-delay:-12s; opacity:.55; }
  .cloud.c2::before { width:40px; height:40px; top:-20px; left:10px; }
  .cloud.c2::after { width:30px; height:30px; top:-15px; left:38px; }

  .cloud.c3 { width:160px; height:50px; top:55%; animation-duration:35s; animation-delay:-2s; opacity:.4; }
  .cloud.c3::before { width:80px; height:80px; top:-40px; left:20px; }
  .cloud.c3::after { width:60px; height:60px; top:-30px; left:80px; }

  @keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(calc(100vw + 220px)); } }

  .plane-bg {
    position: fixed;
    font-size: 48px;
    top: 8%;
    animation: fly 18s linear infinite;
    opacity: 0.18;
    z-index: 1;
  }
  @keyframes fly {
    from { left: -80px; transform: rotate(-5deg); }
    to { left: calc(100vw + 80px); transform: rotate(-5deg); }
  }

  /* ===== layout ===== */
  #main {
    position: relative; z-index: 2;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px;
  }

  /* ===== Polaroid card ===== */
  .polaroid {
    background: #fff;
    border-radius: 4px;
    padding: 18px 18px 56px;
    box-shadow: 4px 6px 0 rgba(0,0,0,.18), 0 12px 40px rgba(0,0,0,.22);
    width: 100%;
    max-width: 380px;
    position: relative;
    transform: rotate(-1.2deg);
    transition: transform .3s;
  }
  .polaroid:hover { transform: rotate(0deg) scale(1.01); }

  /* tape strips */
  .tape {
    position: absolute;
    width: 60px; height: 22px;
    background: rgba(255,220,100,.65);
    border-radius: 2px;
    top: -11px; left: 50%; transform: translateX(-50%);
  }

  .polaroid-photo {
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: 2px;
    overflow: hidden;
    background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 50%, #5ba3d9 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 72px;
    position: relative;
  }
  .polaroid-photo .sticker {
    position: absolute;
    font-size: 28px;
    opacity: .6;
  }
  .polaroid-photo .sticker.s1 { top:8px; right:10px; transform: rotate(12deg); }
  .polaroid-photo .sticker.s2 { bottom:8px; left:10px; transform: rotate(-8deg); }

  .polaroid-caption {
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-family: 'Permanent Marker', cursive;
    font-size: 20px;
    color: #333;
    letter-spacing: 1px;
  }

  /* ===== stamp ===== */
  .stamp {
    position: absolute;
    top: 14px; right: 14px;
    border: 3px solid var(--stamp);
    border-radius: 4px;
    padding: 4px 8px;
    font-family: 'Permanent Marker', cursive;
    font-size: 11px;
    color: var(--stamp);
    transform: rotate(8deg);
    opacity: .85;
    line-height: 1.3;
    text-align: center;
  }

  /* ===== lobby ===== */
  .lobby-wrap { padding: 0 0 8px; }
  .logo-emoji { font-size: 56px; display: block; text-align: center; margin-bottom: 4px; }
  .game-title {
    font-family: 'Permanent Marker', cursive;
    font-size: 38px;
    color: var(--deep);
    text-align: center;
    line-height: 1;
    margin-bottom: 6px;
  }
  .game-sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 18px; font-weight: 600; letter-spacing: .5px; }

  .rules-strip {
    background: var(--cream);
    border: 2px dashed #ddd;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .rule { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #444; margin-bottom: 6px; line-height: 1.35; }
  .rule:last-child { margin-bottom: 0; }

  /* ===== buttons ===== */
  .btn-fly {
    display: block; width: 100%;
    background: var(--deep);
    color: #fff;
    font-family: 'Permanent Marker', cursive;
    font-size: 20px;
    letter-spacing: 2px;
    border: none; border-radius: 6px;
    padding: 14px;
    cursor: pointer;
    box-shadow: 3px 4px 0 rgba(0,0,0,.25);
    transition: transform .1s, box-shadow .1s;
    text-align: center;
  }
  .btn-fly:hover { transform: translateY(-2px); box-shadow: 3px 6px 0 rgba(0,0,0,.22); }
  .btn-fly:active { transform: translateY(1px); box-shadow: 1px 2px 0 rgba(0,0,0,.2); }
  .btn-fly.green { background: var(--mint); color: #fff; }
  .btn-fly.coral { background: var(--coral); }

  /* ===== countdown ===== */
  .countdown-wrap { text-align: center; padding: 20px 0 10px; }
  .cd-label { font-size: 13px; color: #999; font-weight: 600; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .cd-ring {
    width: 100px; height: 100px;
    border: 5px solid var(--deep);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
    background: var(--gold);
    box-shadow: 4px 5px 0 rgba(0,0,0,.2);
    animation: pulse 0.85s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .cd-num { font-family: 'Permanent Marker', cursive; font-size: 52px; color: var(--deep); line-height: 1; }
  .cd-sub { font-size: 13px; color: #aaa; font-weight: 600; }

  /* ===== game ===== */
  .game-wrap { width: 100%; }

  .toprow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .counter { font-size: 12px; font-weight: 800; color: #888; letter-spacing: .5px; text-transform: uppercase; }
  .timer-val {
    font-family: 'Permanent Marker', cursive;
    font-size: 20px;
    color: var(--deep);
    background: var(--gold);
    padding: 2px 10px;
    border-radius: 4px;
    border: 2px solid var(--deep);
  }
  .timer-val.urgent { background: var(--coral); color: #fff; animation: shake .3s infinite; }
  @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-2deg)} 75%{transform:rotate(2deg)} }

  .bar { height: 6px; background: #ddd; border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .fill { height: 100%; background: linear-gradient(90deg, var(--mint), var(--deep)); border-radius: 4px; transition: width .25s; }
  .fill.urgent { background: linear-gradient(90deg, var(--coral), #c0392b); }

  .score-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--deep); color: var(--gold);
    font-family: 'Permanent Marker', cursive;
    font-size: 17px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
    transform: rotate(-1deg);
  }
  .delta { font-size: 13px; opacity: .8; }

  .clue-box {
    background: var(--cream);
    border: 2px solid #ddd;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 14px;
    position: relative;
  }
  .clue-box::before {
    content: 'CLUE';
    position: absolute; top: -10px; left: 12px;
    background: var(--gold);
    color: var(--deep);
    font-family: 'Permanent Marker', cursive;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 3px;
    border: 2px solid var(--deep);
  }
  .clue-text { font-size: 15px; color: #333; font-weight: 600; line-height: 1.4; margin-top: 4px; }

  .word-boxes { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 16px; min-height: 44px; }
  .box {
    width: 32px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Permanent Marker', cursive;
    font-size: 17px;
    border-radius: 4px;
    border: 2px solid #ccc;
    background: #f9f9f9;
    color: #333;
    transition: all .2s;
  }
  .box.hint { background: #FFF9C4; border-color: #F9A825; color: var(--deep); }
  .box.correct { background: var(--mint); border-color: #3a9d5c; color: #fff; }

  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .opt {
    background: #fff;
    border: 2.5px solid var(--deep);
    border-radius: 8px;
    padding: 10px 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--deep);
    cursor: pointer;
    transition: all .15s;
    box-shadow: 2px 3px 0 rgba(0,0,0,.12);
    text-align: center;
    line-height: 1.25;
  }
  .opt:hover:not(.disabled):not(.correct):not(.wrong) {
    background: var(--gold);
    transform: translateY(-2px);
    box-shadow: 2px 5px 0 rgba(0,0,0,.15);
  }
  .opt.correct { background: var(--mint); color: #fff; border-color: #3a9d5c; box-shadow: 2px 3px 0 #2d8050; }
  .opt.wrong { background: var(--coral); color: #fff; border-color: #c0392b; box-shadow: 2px 3px 0 #a02020; }
  .opt.disabled { opacity: .45; cursor: default; pointer-events: none; }

  .hint-btn {
    display: block; width: 100%;
    background: transparent;
    border: 2px dashed #bbb;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #999;
    cursor: pointer;
    transition: all .15s;
  }
  .hint-btn:hover:not(:disabled) { border-color: var(--deep); color: var(--deep); background: #f0f8ff; }
  .hint-btn:disabled { opacity: .4; cursor: default; }

  /* ===== results ===== */
  .results-wrap { text-align: center; padding: 8px 0; }
  .result-emoji { font-size: 64px; display: block; margin-bottom: 8px; }

  .result-title {
    font-family: 'Permanent Marker', cursive;
    font-size: 30px;
    color: var(--deep);
    margin-bottom: 4px;
  }
  .result-sub { font-size: 13px; color: #888; font-weight: 600; margin-bottom: 18px; }

  /* passport stamp result */
  .passport {
    background: var(--cream);
    border: 3px solid var(--deep);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .passport::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg, transparent, transparent 10px,
      rgba(0,0,0,.025) 10px, rgba(0,0,0,.025) 20px
    );
  }
  .passport-title {
    font-family: 'Permanent Marker', cursive;
    font-size: 13px;
    color: #aaa;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .stat-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .stat-box {
    background: #fff;
    border: 2px solid var(--deep);
    border-radius: 6px;
    padding: 10px 16px;
    min-width: 90px;
    box-shadow: 2px 3px 0 rgba(0,0,0,.1);
    transform: rotate(-1deg);
  }
  .stat-box:nth-child(2) { transform: rotate(1.5deg); }
  .stat-box:nth-child(3) { transform: rotate(-.5deg); }
  .stat-val {
    font-family: 'Permanent Marker', cursive;
    font-size: 28px;
    color: var(--deep);
    line-height: 1;
    margin-bottom: 2px;
  }
  .stat-val.gold { color: #e6ac00; }
  .stat-val.green { color: var(--mint); }
  .stat-label { font-size: 10px; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

  /* achievement stamp */
  .achievement {
    margin: 16px auto 0;
    display: inline-block;
    border: 4px double var(--stamp);
    border-radius: 8px;
    padding: 10px 18px;
    font-family: 'Permanent Marker', cursive;
    font-size: 15px;
    color: var(--stamp);
    transform: rotate(-2deg);
    background: rgba(192,57,43,.06);
    max-width: 260px;
    line-height: 1.3;
  }

  /* ===== page label ===== */
  .page-label {
    font-size: 11px;
    font-weight: 800;
    color: rgba(255,255,255,.7);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 10px;
    text-shadow: 0 1px 3px rgba(0,0,0,.2);
  }

  /* ===== not in tg ===== */
  .not-tg { text-align: center; padding: 10px 0; }
  .not-tg p { font-size: 14px; color: #555; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>

<!-- Sky BG -->
<div class="sky-bg">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>
<div class="plane-bg">✈️</div>

<!-- App root -->
<div id="main"></div>

<!-- ===== CONFIG ===== -->
<script>
window.GAME_CONFIG = {
  roundId: 1,
  roundEndsAt: null,
  totalWords: 10,
  timeTotalSec: 180,
  maxHints: 3,
  topSize: 10,
  levels: ["easy","medium","hard"],
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: ""
};
</script>

<!-- ===== QUESTIONS ===== -->
<script>
window.QUESTIONS = [
  // ── EASY (20) ──
  { level:"easy", word:"AIRPORT", clue:"The place where planes take off and land ✈️", options:["AIRPORT","SEAPORT","STATION","HARBOR"], correctIndex:0 },
  { level:"easy", word:"PASSPORT", clue:"The document you need to cross international borders 📕", options:["TICKET","PASSPORT","LICENSE","VISA"], correctIndex:1 },

  { level:"easy", word:"PILOT", clue:"The person who flies the plane 🧑‍✈️", options:["PILOT","CAPTAIN","STEWARD","MECHANIC"], correctIndex:0 },
  { level:"easy", word:"LUGGAGE", clue:"Bags and suitcases you travel with 🧳", options:["CARGO","LUGGAGE","FREIGHT","PACKAGE"], correctIndex:1 },
  { level:"easy", word:"TERMINAL", clue:"The building at an airport where passengers check in and board 🏢", options:["HANGAR","DEPOT","TERMINAL","LOUNGE"], correctIndex:2 },
  { level:"easy", word:"BOARDING", clue:"The process of getting onto the plane 🚪", options:["LANDING","DOCKING","TAXIING","BOARDING"], correctIndex:3 },
  { level:"easy", word:"ALTITUDE", clue:"The height of an aircraft above sea level ⬆️", options:["ALTITUDE","LATITUDE","LONGITUDE","ATTITUDE"], correctIndex:0 },
  { level:"easy", word:"VISA", clue:"An official permit to enter a foreign country 🗃️", options:["PERMIT","TICKET","VISA","STAMP"], correctIndex:2 },
  { level:"easy", word:"COCKPIT", clue:"Where the pilot sits and controls the aircraft 🎛️", options:["CABIN","CARGO","COCKPIT","GALLEY"], correctIndex:2 },
  { level:"easy", word:"SEATBELT", clue:"Safety strap you must wear during turbulence 🔒", options:["HARNESS","SEATBELT","STRAP","BUCKLE"], correctIndex:1 },
  { level:"easy", word:"CABIN", clue:"The passenger area inside the aircraft 🪑", options:["HULL","CABIN","DECK","HOLD"], correctIndex:1 },
  { level:"easy", word:"CUSTOMS", clue:"The border checkpoint where goods are checked 🔍", options:["SECURITY","CUSTOMS","IMMIGRATION","CONTROL"], correctIndex:1 },

  { level:"easy", word:"LOUNGE", clue:"A comfortable waiting area at the airport, often VIP 🛋️", options:["LOUNGE","LOBBY","HALL","ATRIUM"], correctIndex:0 },
  { level:"easy", word:"CARGO", clue:"Goods transported by an aircraft 📦", options:["FREIGHT","LUGGAGE","CARGO","BAGGAGE"], correctIndex:2 },
  { level:"easy", word:"CREW", clue:"All the people who operate and service the flight ✈️", options:["STAFF","TEAM","CREW","SQUAD"], correctIndex:2 },
  { level:"easy", word:"REFUEL", clue:"To fill the aircraft with fuel before departure ⛽", options:["RELOAD","RESTOCK","REFUEL","RECHARGE"], correctIndex:2 },

  // ── MEDIUM (22) ──
  { level:"medium", word:"FUSELAGE", clue:"The main body of an aircraft where passengers sit 🛩", options:["COCKPIT","FUSELAGE","TURBINE","AILERON"], correctIndex:1 },
  { level:"medium", word:"LAYOVER", clue:"A stop between two flights where you wait at an airport 🕐", options:["STOPOVER","TRANSFER","LAYOVER","TRANSIT"], correctIndex:2 },
  { level:"medium", word:"TURBULENCE", clue:"Rough, bumpy air movement that shakes the plane ⚡", options:["TURBULENCE","WINDSHEAR","DOWNDRAFT","HEADWIND"], correctIndex:0 },
  { level:"medium", word:"AUTOPILOT", clue:"A system that flies the aircraft automatically 🤖", options:["AUTOPILOT","AVIONICS","GYROSCOPE","TRANSPONDER"], correctIndex:0 },
  { level:"medium", word:"TAILWIND", clue:"Wind blowing in the same direction as the aircraft, speeding it up 💨", options:["HEADWIND","CROSSWIND","TAILWIND","SLIPSTREAM"], correctIndex:2 },
  { level:"medium", word:"HANGAR", clue:"A large building where aircraft are stored and maintained 🏭", options:["TERMINAL","DEPOT","APRON","HANGAR"], correctIndex:3 },
  { level:"medium", word:"JETLAG", clue:"Fatigue caused by crossing many time zones quickly 😴", options:["AIRSICK","HEATSTROKE","DEHYDRATION","JETLAG"], correctIndex:3 },
  { level:"medium", word:"MANIFOLD", clue:"An engine part that distributes air or exhaust to multiple outlets 🔧", options:["PISTON","MANIFOLD","CRANKSHAFT","CAMSHAFT"], correctIndex:1 },
  { level:"medium", word:"TAXIWAY", clue:"The path aircraft use to move between runway and terminal 🛣️", options:["TAXIWAY","APRON","RUNWAY","TARMAC"], correctIndex:0 },
  { level:"medium", word:"HEADWIND", clue:"Wind blowing against the direction of the aircraft, slowing it down 🌬️", options:["TAILWIND","CROSSWIND","SLIPSTREAM","HEADWIND"], correctIndex:3 },
  { level:"medium", word:"GALLEY", clue:"The kitchen area on an aircraft where food is prepared 🍽️", options:["PANTRY","BUFFET","GALLEY","LARDER"], correctIndex:2 },
  { level:"medium", word:"CHARTER", clue:"A flight hired by a group rather than a regular scheduled service 📋", options:["SHUTTLE","CHARTER","PRIVATE","EXPRESS"], correctIndex:1 },
  { level:"medium", word:"DESCENT", clue:"When the aircraft begins to lose altitude before landing ⬇️", options:["APPROACH","DIVE","DESCENT","DROP"], correctIndex:2 },
  { level:"medium", word:"CHECKIN", clue:"The process of registering for your flight at the airport counter 🖥️", options:["CHECKIN","BOARDING","SCREENING","CLEARANCE"], correctIndex:0 },
  { level:"medium", word:"OVERBOOK", clue:"When an airline sells more tickets than seats available 🪑", options:["UPGRADE","WAITLIST","OVERBOOK","STANDBY"], correctIndex:2 },
  { level:"medium", word:"MILEAGE", clue:"Points earned by frequent flyers based on distance flown 🌐", options:["POINTS","CREDIT","MILEAGE","REWARD"], correctIndex:2 },
  { level:"medium", word:"FLAPS", clue:"Wing surfaces extended during takeoff and landing to increase lift 🪽", options:["SPOILERS","RUDDER","FLAPS","SLATS"], correctIndex:2 },
  { level:"medium", word:"TAXIING", clue:"Moving the aircraft slowly on the ground under its own power 🚕", options:["TAXIING","ROLLING","BRAKING","TOWING"], correctIndex:0 },
  { level:"medium", word:"MANIFEST", clue:"The official list of passengers and cargo on a flight 📝", options:["ROSTER","ITINERARY","MANIFEST","SCHEDULE"], correctIndex:2 },
  { level:"medium", word:"HOLDING", clue:"When ATC instructs aircraft to fly in circles while waiting to land 🔄", options:["CIRCLING","WAITING","HOLDING","QUEUING"], correctIndex:2 },
  { level:"medium", word:"PUSHBACK", clue:"When a tug truck reverses the aircraft away from the gate ↩️", options:["TOWING","PUSHBACK","REVERSE","WITHDRAW"], correctIndex:1 },
  { level:"medium", word:"AIRSPEED", clue:"The speed of an aircraft relative to the surrounding air 💨", options:["GROUNDSPEED","AIRSPEED","WINDSPEED","MACH"], correctIndex:1 },

  // ── HARD (20) ──
  { level:"hard", word:"AILERON", clue:"Movable flaps on the wings that control the plane's roll 🛫", options:["AILERON","ELEVATOR","RUDDER","FLAP"], correctIndex:0 },
  { level:"hard", word:"TRANSPONDER", clue:"A device that broadcasts the aircraft's identity to radar 📡", options:["TRANSMITTER","GYROSCOPE","TRANSPONDER","ALTIMETER"], correctIndex:2 },
  { level:"hard", word:"PITOT", clue:"A tube on the aircraft that measures airspeed 🌬️", options:["VENTURI","PITOT","BERNOULLI","STATIC"], correctIndex:1 },
  { level:"hard", word:"APRON", clue:"The paved area near hangars where aircraft are parked and loaded 🅿️", options:["APRON","TAXIWAY","THRESHOLD","TARMAC"], correctIndex:0 },
  { level:"hard", word:"DEADHEAD", clue:"A crew member traveling on a flight as a passenger for positioning 👤", options:["STANDBY","JUMPSEATER","DEADHEAD","COMMUTER"], correctIndex:2 },
  { level:"hard", word:"WAYPOINT", clue:"A geographic reference point used in navigation for a flight route 📍", options:["CHECKPOINT","BEACON","WAYPOINT","FIX"], correctIndex:2 },
  { level:"hard", word:"SQUAWK", clue:"A 4-digit code entered into a transponder for air traffic control 🔢", options:["BEACON","SQUAWK","PING","PULSE"], correctIndex:1 },
  { level:"hard", word:"AVIONICS", clue:"The electronic systems used in aircraft for navigation and communication 💻", options:["AVIONICS","HYDRAULICS","PNEUMATICS","ELECTRICS"], correctIndex:0 },
  { level:"hard", word:"VORTEX", clue:"A dangerous swirling wake of air left behind a large aircraft 🌀", options:["SLIPSTREAM","VORTEX","TURBULENCE","DOWNDRAFT"], correctIndex:1 },
  { level:"hard", word:"GLIDE", clue:"Flying without engine power, descending gradually ⛵", options:["GLIDE","DIVE","SOAR","COAST"], correctIndex:0 },
  { level:"hard", word:"BEACON", clue:"A radio or light signal that helps aircraft navigate at night 🔦", options:["BEACON","RADAR","STROBE","SIGNAL"], correctIndex:0 },
  { level:"hard", word:"STALL", clue:"When a wing loses lift because it exceeds the critical angle of attack ⚠️", options:["SPIN","STALL","DIVE","SLIP"], correctIndex:1 },
  { level:"hard", word:"VECTOR", clue:"A heading given by ATC to guide an aircraft to its destination 🧭", options:["ROUTE","VECTOR","TRACK","BEARING"], correctIndex:1 },
  { level:"hard", word:"CALLSIGN", clue:"The unique identifier used to address an aircraft over radio 📻", options:["TAILNUMBER","CALLSIGN","FLIGHTCODE","REGISTRY"], correctIndex:1 },
  { level:"hard", word:"MINIMUMS", clue:"The lowest altitude a pilot can descend to before seeing the runway 📉", options:["THRESHOLD","FLOOR","MINIMUMS","BASELINE"], correctIndex:2 },
  { level:"hard", word:"SPOILERS", clue:"Wing panels raised after landing to kill lift and slow the aircraft 🛑", options:["BRAKES","FLAPS","SPOILERS","SLATS"], correctIndex:2 },
  { level:"hard", word:"ZENITH", clue:"The point in the sky directly above the observer 🌟", options:["APEX","ZENITH","NADIR","PEAK"], correctIndex:1 },
  { level:"hard", word:"YOKE", clue:"The control wheel in the cockpit that steers the aircraft 🎮", options:["JOYSTICK","THROTTLE","YOKE","PEDAL"], correctIndex:2 },
  { level:"hard", word:"MAYDAY", clue:"The international distress call used by aircraft in emergency 🆘", options:["SOS","ALERT","MAYDAY","PANPAN"], correctIndex:2 },
  { level:"hard", word:"INERTIA", clue:"The tendency of an aircraft to keep moving in the same direction 🎯", options:["MOMENTUM","INERTIA","GRAVITY","DRAG"], correctIndex:1 },
];
</script>

<!-- ===== GAME ===== -->
<script type="module">
const CFG = window.GAME_CONFIG;
const tg = window.Telegram?.WebApp;

// Telegram init
try { tg?.ready?.(); tg?.expand?.(); } catch(_) {}

function getTgUser() {
  const u = tg?.initDataUnsafe?.user;
  // DEV FALLBACK — remove in production
  if (!u) return { user_id: 99999, username: "traveler", first_name: "Explorer" };
  return { user_id: u.id, username: u.username||null, first_name: u.first_name||null };
}

// ===== DOM =====
const $ = sel => document.querySelector(sel);
const root = $("#main");
function render(html) { root.innerHTML = html; }

function esc(s) {
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}
function shuffle(a) {
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}
function clamp(v,mn,mx){ return Math.max(mn,Math.min(mx,v)); }
function fmt(s){ const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,"0")}`; }

// ===== Questions =====
function normalizeQ(q){
  return {
    level: q.level||"easy",
    word: String(q.word||"").trim(),
    clue: String(q.clue||"").trim(),
    options: (q.options||[]).map(String),
    correctIndex: Number.isInteger(q.correctIndex)?q.correctIndex:0
  };
}
function mixOptions(q){
  const items = q.options.map((t,i)=>({t,i}));
  const mixed = shuffle(items);
  return { ...q, options: mixed.map(x=>x.t), correctIndex: mixed.findIndex(x=>x.i===q.correctIndex) };
}
function buildRun(){
  const pool = shuffle(window.QUESTIONS.map(normalizeQ)).filter(q=>q.options.length===4);
  return pool.slice(0, CFG.totalWords).map(mixOptions);
}

// ===== Constants =====
const SCORE_FAST=100, SCORE_SLOW=60, PENALTY_HINT=30, PENALTY_WRONG=10, BONUS_FINISH=200;

let run = null;

function startNewRun(){
  const user = getTgUser();
  run = {
    user, questions:buildRun(), idx:0, score:0,
    hintsLeft:CFG.maxHints, startTs:Date.now(), qStartTs:Date.now(),
    timerId:null, revealed:new Set()
  };
  showCountdown();
}

// ===== Screens =====
function lobbyHTML(){
  return `
    <div class="page-label">✈️ TRAVEL RUSH</div>
    <div class="polaroid">
      <div class="tape"></div>
      <div class="stamp">BOARDING<br>PASS</div>
      <div class="polaroid-photo">
        ✈️
        <span class="sticker s1">🌍</span>
        <span class="sticker s2">🗺</span>
      </div>
      <div class="polaroid-caption">TRAVEL RUSH</div>

      <div class="lobby-wrap" style="margin-top:44px">
        <div class="game-sub">Aviation & Transport Quiz</div>
        <div class="game-sub" style="font-size:12px;color:#999;margin-top:-10px;margin-bottom:14px">Guess ${CFG.totalWords} terms in ${Math.floor(CFG.timeTotalSec/60)} minutes</div>

        <div class="rules-strip">
          <div class="rule">⏱ <span><b>${Math.floor(CFG.timeTotalSec/60)} min</b> total time</span></div>
          <div class="rule">📖 <span>Read the clue — pick the right term</span></div>
          <div class="rule">💡 <span>Up to <b>${CFG.maxHints} hints</b> per run</span></div>
          <div class="rule">⚡ <span>Fast answer = <b>more points</b></span></div>
        </div>

        <button class="btn-fly" id="btnStart">TAKE OFF →</button>
      </div>
    </div>
  `;
}

function countdownHTML(n){
  return `
    <div class="page-label">GET READY FOR TAKEOFF</div>
    <div class="polaroid">
      <div class="tape"></div>
      <div class="countdown-wrap">
        <div class="cd-label">Starting in</div>
        <div class="cd-ring"><div class="cd-num" id="cdNum">${n}</div></div>
        <div class="cd-sub">Fasten your seatbelt ✈️</div>
      </div>
    </div>
  `;
}

function gameHTML(){
  const q = run.questions[run.idx];
  const left = remaining();
  return `
    <div class="page-label">FLIGHT IN PROGRESS</div>
    <div class="polaroid" style="transform:rotate(.5deg)">
      <div class="tape"></div>
      <div class="game-wrap">
        <div class="toprow">
          <span class="counter">Q ${run.idx+1}/${CFG.totalWords} · ${q.level.toUpperCase()}</span>
          <span class="timer-val" id="timerVal">${fmt(left)}</span>
        </div>
        <div class="bar"><div class="fill" id="timerFill" style="width:${(left/CFG.timeTotalSec)*100}%"></div></div>

        <div style="margin-bottom:12px">
          <span class="score-badge">⭐ <span id="scoreVal">${run.score}</span> pts <span class="delta" id="deltaVal"></span></span>
        </div>

        <div class="clue-box">
          <div class="clue-text">${esc(q.clue)}</div>
        </div>

        <div class="word-boxes" id="wordBoxes"></div>

        <div class="opt-grid" id="optGrid">
          ${q.options.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join("")}
        </div>

        <button class="hint-btn" id="hintBtn">${hintLabel()}</button>
      </div>
    </div>
  `;
}

function getEmoji(pct){
  if(pct>=90) return { e:"🏆", t:"ELITE AVIATOR", m:"Perfect score! You were born to fly." };
  if(pct>=70) return { e:"🥇", t:"CAPTAIN", m:"Outstanding knowledge of aviation!" };
  if(pct>=50) return { e:"🥈", t:"CO-PILOT", m:"Solid flight — room to grow!" };
  if(pct>=30) return { e:"🥉", t:"FLIGHT STUDENT", m:"Good start, keep studying!" };
  return { e:"🌱", t:"FREQUENT FLYER", m:"Lots to learn — but you'll get there!" };
}

function resultsHTML({ finalScore, wordsSolved, secondsLeft, outOfTime }){
  const maxScore = CFG.totalWords * SCORE_FAST + BONUS_FINISH;
  const pct = Math.round((finalScore / maxScore) * 100);
  const {e, t, m} = getEmoji(pct);
  const accuracy = CFG.totalWords>0 ? Math.round((wordsSolved/CFG.totalWords)*100) : 0;

  return `
    <div class="page-label">${outOfTime ? "⏰ TIME'S UP!" : "🛬 LANDED!"}</div>
    <div class="polaroid" style="transform:rotate(-1.5deg)">
      <div class="tape"></div>
      <div class="results-wrap">
        <span class="result-emoji">${e}</span>
        <div class="result-title">${t}</div>
        <div class="result-sub">${m}</div>

        <div class="passport">
          <div class="passport-title">FLIGHT LOG</div>
          <div class="stat-row">
            <div class="stat-box">
              <div class="stat-val gold">${finalScore}</div>
              <div class="stat-label">POINTS</div>
            </div>
            <div class="stat-box">
              <div class="stat-val green">${accuracy}%</div>
              <div class="stat-label">ACCURACY</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">${secondsLeft}s</div>
              <div class="stat-label">TIME LEFT</div>
            </div>
          </div>
          <div class="achievement">
            ${wordsSolved}/${CFG.totalWords} TERMS SOLVED ✈️
          </div>
        </div>

        <button class="btn-fly green" id="btnAgain">FLY AGAIN →</button>
      </div>
    </div>
  `;
}

// ===== Timer =====
function remaining(){ return clamp(CFG.timeTotalSec - Math.floor((Date.now()-run.startTs)/1000), 0, CFG.timeTotalSec); }

function startTimer(){
  run.timerId = setInterval(()=>{
    const left = remaining();
    const et = $("#timerVal"), ef = $("#timerFill");
    if(!et) return;
    et.textContent = fmt(left);
    ef.style.width = `${(left/CFG.timeTotalSec)*100}%`;
    if(left<=20){ et.classList.add("urgent"); ef.classList.add("urgent"); }
    else { et.classList.remove("urgent"); ef.classList.remove("urgent"); }
    if(left<=0) finishRun(true);
  }, 250);
}

// ===== Letters =====
function renderLetters(word){
  const html = word.toUpperCase().split("").map((ch,i)=>{
    const rev = run.revealed.has(i);
    return `<div class="box ${rev?"hint":"empty"}">${rev?esc(ch):"_"}</div>`;
  }).join("");
  $("#wordBoxes").innerHTML = html;
}

function hintLabel(){ return run.hintsLeft>0 ? `💡 Hint (${run.hintsLeft} left)` : `No hints left`; }

function useHint(){
  if(run.hintsLeft<=0) return;
  const q = run.questions[run.idx];
  const word = q.word || q.options[q.correctIndex];
  const candidates = [];
  for(let i=0;i<word.length;i++) if(!run.revealed.has(i)&&word[i]!==" ") candidates.push(i);
  if(!candidates.length) return;

  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  run.revealed.add(pick);
  run.hintsLeft--;
  run.score = Math.max(0, run.score - PENALTY_HINT);

  const sv=$("#scoreVal"), dv=$("#deltaVal");
  if(sv) sv.textContent=run.score;
  if(dv) dv.textContent=`(-${PENALTY_HINT})`;

  renderLetters(word);
  const hb=$("#hintBtn");
  if(hb){ hb.textContent=hintLabel(); hb.disabled=run.hintsLeft<=0; }
}

// ===== Answer =====
function onPick(idx, btn){
  const q=run.questions[run.idx];
  const correct = idx===q.correctIndex;
  const btns=[...$("#optGrid").querySelectorAll("button")];
  btns.forEach(b=>b.classList.add("disabled"));

  if(correct){
    const sec=(Date.now()-run.qStartTs)/1000;
    const add = sec<5 ? SCORE_FAST : SCORE_SLOW;
    run.score += add;
    const sv=$("#scoreVal"),dv=$("#deltaVal");
    if(sv) sv.textContent=run.score;
    if(dv) dv.textContent=`(+${add})`;
    btn.classList.remove("disabled"); btn.classList.add("correct");

    const word=(q.word||q.options[q.correctIndex]).toUpperCase();
    const wb=$("#wordBoxes");
    if(wb) wb.innerHTML=word.split("").map(ch=>`<div class="box correct">${esc(ch)}</div>`).join("");

    setTimeout(()=>{ run.idx++; if(run.idx>=run.questions.length) finishRun(false); else showGame(); }, 650);
  } else {
    run.score = Math.max(0, run.score-PENALTY_WRONG);
    const sv=$("#scoreVal"),dv=$("#deltaVal");
    if(sv) sv.textContent=run.score;
    if(dv) dv.textContent=`(-${PENALTY_WRONG})`;
    btn.classList.remove("disabled"); btn.classList.add("wrong");
    setTimeout(()=>{ btns.forEach(b=>{ if(b===btn) b.classList.add("disabled"); else b.classList.remove("disabled"); }); }, 450);
  }
}

// ===== Flow =====
function showLobby(){
  render(lobbyHTML());
  $("#btnStart").addEventListener("click", startNewRun);
}

function showCountdown(){
  let n=3;
  render(countdownHTML(n));
  const id = setInterval(()=>{
    n--;
    if(n<=0){ clearInterval(id); showGame(); return; }
    const el=$("#cdNum"); if(el) el.textContent=n;
  }, 850);
}

function showGame(){
  run.revealed = new Set();
  render(gameHTML());
  const q=run.questions[run.idx];
  const word=(q.word||q.options[q.correctIndex]).toUpperCase();
  renderLetters(word);

  $("#optGrid").querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click",()=>onPick(parseInt(btn.dataset.i,10),btn));
  });

  const hb=$("#hintBtn");
  hb.addEventListener("click", useHint);
  hb.textContent=hintLabel();
  hb.disabled=run.hintsLeft<=0;

  run.qStartTs=Date.now();
  if(!run.timerId) startTimer();
}

function finishRun(outOfTime){
  clearInterval(run.timerId);
  const wordsSolved = outOfTime ? run.idx : CFG.totalWords;
  const secondsLeft = remaining();
  let finalScore = run.score;
  if(!outOfTime && wordsSolved===CFG.totalWords) finalScore+=BONUS_FINISH;

  render(resultsHTML({ finalScore, wordsSolved, secondsLeft, outOfTime }));
  $("#btnAgain").addEventListener("click",()=>{ run.timerId=null; startNewRun(); });
}

showLobby();
</script>
</body>
</html>
