<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Word Rush — Daily English</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg-1:#03050f;
  --glass-bg:rgba(10,20,50,.55);
  --glass-border:rgba(80,130,255,.18);
  --glass-shine:rgba(255,255,255,.06);
  --text:#f0f4ff;
  --text-dim:rgba(180,200,255,.55);
  --electric:#4d8dff;
  --green:#00e676;
  --red:#ff4d6d;
  --gold:#ffd740;
}

body{
  background:var(--bg-1);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:18px 12px;
  font-family:'Space Grotesk',sans-serif;
  position:relative;overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 20%, rgba(15,40,120,.5) 0%, transparent 70%),
    radial-gradient(ellipse 500px 500px at 80% 70%, rgba(8,25,80,.4) 0%, transparent 70%),
    radial-gradient(ellipse 300px 300px at 50% 50%, rgba(20,50,150,.2) 0%, transparent 70%);
  pointer-events:none;z-index:0;
}
body>*{position:relative;z-index:1}

.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid var(--glass-border);
  box-shadow:0 8px 32px rgba(0,0,0,.5),0 1px 0 var(--glass-shine) inset,0 0 0 1px rgba(255,255,255,.03) inset;
}

/* APP SHELL */
.shell{
  width:375px;
  background:linear-gradient(180deg,#060b1a 0%, #03050f 100%);
  border-radius:34px;
  border:1.5px solid rgba(60,100,200,.2);
  overflow:hidden;
  box-shadow:0 50px 100px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04), 0 0 60px rgba(15,50,150,.15);
}

.app-top{
  padding:12px 16px;
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid rgba(50,80,180,.15);
  background:rgba(5,10,28,.9);
  backdrop-filter:blur(20px);
}
.app-title{
  font-size:12px;font-weight:800;letter-spacing:2px;
  color:rgba(240,244,255,.9);
}

.main{
  padding:16px 12px;
  min-height:620px;
  display:flex;flex-direction:column;gap:12px;
}

.page-label{
  font-size:10px;color:rgba(77,141,255,.5);
  text-align:center;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:600;
}

.card{
  border-radius:20px;overflow:hidden;
  animation:fadeUp .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* LOBBY */
.lobby{padding:24px 20px;text-align:center}
.logo{
  width:80px;height:80px;border-radius:22px;margin:0 auto 14px;
  background:linear-gradient(135deg, rgba(30,79,196,.4), rgba(10,30,90,.6));
  border:1px solid rgba(77,141,255,.3);
  display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:0 0 30px rgba(30,79,196,.3), 0 0 60px rgba(30,79,196,.1);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.h1{
  font-size:26px;font-weight:800;
  background:linear-gradient(135deg,#fff 30%, #6da8ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-.5px;margin-bottom:4px;
}
.sub{font-size:13px;color:var(--text-dim);margin-bottom:18px}
.rules{
  background:rgba(20,40,100,.28);
  border:1px solid rgba(77,141,255,.14);
  border-radius:14px;padding:14px 16px;text-align:left;margin-bottom:18px
}
.rule{font-size:13px;color:rgba(200,215,255,.85);padding:5px 0;display:flex;gap:8px;align-items:center}
.rule b{color:var(--electric);font-weight:700}
.btn{
  width:100%;
  background:linear-gradient(135deg,#1e4fc4,#0d2a7a);
  border:1px solid rgba(100,160,255,.3);
  border-radius:14px;padding:14px;
  font-size:15px;font-weight:700;color:#fff;
  cursor:pointer;font-family:inherit;
  transition:all .18s;letter-spacing:.3px;
  box-shadow:0 4px 20px rgba(30,79,196,.4), 0 1px 0 rgba(255,255,255,.1) inset;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(30,79,196,.55)}

/* COUNTDOWN */
.countdown{padding:52px 20px;text-align:center}
.ring{
  width:120px;height:120px;border-radius:50%;margin:0 auto 16px;
  background:rgba(20,40,100,.4);
  border:2px solid rgba(77,141,255,.3);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(30,79,196,.3), 0 0 80px rgba(30,79,196,.1);
}
.big{
  font-size:64px;font-weight:800;
  background:linear-gradient(135deg,#fff,#6da8ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:scalePop .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes scalePop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.small{font-size:14px;color:var(--text-dim);letter-spacing:.5px}

/* GAME */
.game{padding:16px 18px}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.counter{font-size:11px;color:var(--text-dim);letter-spacing:.8px;text-transform:uppercase;font-weight:600}
.timer{
  font-family:'JetBrains Mono',monospace;
  font-size:22px;font-weight:600;color:var(--gold);
  text-shadow:0 0 12px rgba(255,215,64,.35);
}
.timer.urgent{color:var(--red);text-shadow:0 0 12px rgba(255,77,109,.45);animation:blink .6s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.bar{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-bottom:14px}
.fill{height:100%;background:linear-gradient(90deg,#1e4fc4,#4d8dff);border-radius:2px;transition:width .25s linear;box-shadow:0 0 8px rgba(77,141,255,.5)}
.fill.urgent{background:linear-gradient(90deg,#c41e3a,#ff4d6d);box-shadow:0 0 8px rgba(255,77,109,.45)}

.badge{
  display:inline-flex;gap:6px;align-items:center;
  background:rgba(0,230,118,.10);
  border:1px solid rgba(0,230,118,.22);
  border-radius:20px;padding:4px 12px;
  font-size:12px;font-weight:800;color:var(--green);
  box-shadow:0 0 12px rgba(0,230,118,.08);
}
.badge .delta{font-size:11px;font-weight:700;color:rgba(0,230,118,.7)}

.clue{
  background:rgba(15,30,70,.5);
  border:1px solid rgba(77,141,255,.15);
  border-radius:14px;padding:13px 14px;margin:12px 0 14px;
}
.clue .label{
  font-size:10px;color:rgba(77,141,255,.6);
  text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:7px
}
.clue .text{font-size:13px;color:rgba(200,215,255,.92);line-height:1.6}

.word{
  display:flex;gap:5px;justify-content:center;flex-wrap:wrap;
  margin-bottom:14px;
}
.box{
  width:34px;height:40px;border-radius:9px;
  background:rgba(10,20,55,.7);
  border:1.5px solid rgba(77,141,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:17px;font-weight:700;color:var(--text);
}
.box.empty{border-style:dashed;opacity:.45}
.box.hint{border-color:rgba(255,215,64,.5);color:var(--gold);background:rgba(255,215,64,.08)}
.box.correct{border-color:rgba(0,230,118,.5);color:var(--green);background:rgba(0,230,118,.10);box-shadow:0 0 14px rgba(0,230,118,.18)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.opt{
  background:rgba(10,22,60,.7);
  border:1.5px solid rgba(77,141,255,.18);
  border-radius:12px;padding:12px 10px;
  font-size:13px;font-weight:700;
  color:rgba(200,215,255,.92);
  cursor:pointer;transition:all .16s;
  font-family:inherit;text-align:center;
  backdrop-filter:blur(8px);
}
.opt:hover{border-color:rgba(77,141,255,.45);background:rgba(20,50,130,.5);color:#fff;transform:translateY(-1px);box-shadow:0 4px 16px rgba(30,79,196,.22)}
.opt.correct{border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.10);color:var(--green);box-shadow:0 0 20px rgba(0,230,118,.18)}
.opt.wrong{border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.10);color:var(--red)}
.opt.disabled{opacity:.35;pointer-events:none}

.hintbtn{
  width:100%;
  background:transparent;
  border:1px dashed rgba(255,215,64,.25);
  border-radius:10px;padding:9px;
  font-size:12px;font-weight:800;
  color:rgba(255,215,64,.55);
  cursor:pointer;font-family:inherit;
  transition:all .18s;letter-spacing:.3px;
}
.hintbtn:hover{border-color:rgba(255,215,64,.5);color:var(--gold);background:rgba(255,215,64,.05)}

/* RESULTS */
.results{padding:22px 20px;text-align:center}
.trophy{
  width:80px;height:80px;border-radius:22px;margin:0 auto 14px;
  background:linear-gradient(135deg, rgba(255,215,64,.2), rgba(255,150,0,.1));
  border:1px solid rgba(255,215,64,.3);
  display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:0 0 30px rgba(255,215,64,.2), 0 0 60px rgba(255,150,0,.1);
}
.rtitle{
  font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#fff 30%, #ffd740 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px
}
.rsub{font-size:13px;color:var(--text-dim);margin-bottom:16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sbox{
  background:rgba(10,20,55,.6);
  border:1px solid rgba(77,141,255,.15);
  border-radius:14px;padding:12px 6px;
}
.sval{font-size:24px;font-weight:900;color:var(--electric)}
.sval.gold{color:var(--gold);text-shadow:0 0 12px rgba(255,215,64,.25)}
.sval.green{color:var(--green);text-shadow:0 0 12px rgba(0,230,118,.25)}
.slabel{font-size:10px;color:var(--text-dim);margin-top:3px;letter-spacing:.5px}

.lb{
  background:rgba(8,16,45,.7);
  border:1px solid rgba(77,141,255,.15);
  border-radius:14px;padding:14px;text-align:left;
  backdrop-filter:blur(12px);
  margin-bottom:14px;
}
.lb .ttl{
  font-size:10px;color:rgba(77,141,255,.5);
  text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:12px;
}
.lb .row{
  display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid rgba(50,80,180,.12);
  font-size:13px;color:rgba(200,215,255,.85);
}
.lb .row:last-child{border-bottom:none}
.rank{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text-dim);width:18px;font-size:12px}
.rank.gold{color:var(--gold)}
.name{flex:1;font-weight:600}
.pts{font-weight:900;color:var(--electric);font-size:13px}

.btn-green{
  width:100%;
  background:linear-gradient(135deg, rgba(0,180,90,.8), rgba(0,130,60,.9));
  border:1px solid rgba(0,230,118,.3);
  border-radius:14px;padding:14px;
  font-size:15px;font-weight:900;color:#fff;
  cursor:pointer;font-family:inherit;
  transition:all .18s;letter-spacing:.3px;
  box-shadow:0 4px 20px rgba(0,180,90,.28), 0 1px 0 rgba(255,255,255,.1) inset;
}
.btn-green:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(0,230,118,.32)}

@media (max-width:420px){
  body{padding:0}
  .shell{width:100%;border-radius:0;min-height:100vh}
  .main{min-height:calc(100vh - 48px)}
}
</style>
</head>
<body>

<div class="shell">
  <div class="app-top">
    <div class="app-title">WORD RUSH</div>
  </div>
  <div class="main" id="main"></div>
</div>

<!-- Supabase JS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ======================================================
// ===============  SUPABASE CONFIG  ====================
// ======================================================
const SUPABASE_URL = "https://ppyyxfvsyxklvxbpunjc.supabase.co";
const SUPABASE_ANON_KEY = "PASTE_YOUR_sb_publishable_KEY_HERE"; // <-- вставь сюда sb_publishable_...
const ROUND_ID = 1; // <-- меняй на 2,3,4... когда начнешь новый турнир

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ======================================================
// ===============  TELEGRAM USER  =======================
// ======================================================
function getTgUser(){
  const tg = window.Telegram?.WebApp;
  const u = tg?.initDataUnsafe?.user;

  // если не из Телеги — дадим гостя (чтоб тестить в браузере)
  const fallback = {
    id: "guest_" + Math.random().toString(16).slice(2),
    username: null,
    first_name: "Guest",
    last_name: null
  };

  return u ?? fallback;
}

function getDisplayName(u){
  // username если есть, иначе имя/фамилия
  if (u?.username) return "@" + u.username;
  const fn = u?.first_name ?? "";
  const ln = u?.last_name ?? "";
  const nm = (fn + " " + ln).trim();
  return nm || "Player";
}

// ======================================================
// ===============  SUPABASE HELPERS  ====================
// ======================================================
async function fetchTop5(roundId){
  try{
    const { data, error } = await sb
      .from("leaderboard")
      .select("username, user_id, score")
      .eq("round_id", roundId)
      .order("score", { ascending: false })
      .order("created_at", { ascending: true })
      .limit(5);

    if (error) throw error;

    return (data ?? []).map(r => ({
      name: r.username || r.user_id,
      pts: r.score
    }));
  }catch(e){
    console.error("fetchTop5 error:", e);
    return [];
  }
}

async function submitScore({ round_id, user_id, username, score }){
  try{
    const payload = {
      round_id,
      user_id: String(user_id),
      username: username ? String(username) : null,
      score: Number(score)
    };

    const { error } = await sb.from("leaderboard").insert(payload);
    if (error) throw error;

    return true;
  }catch(e){
    console.error("submitScore error:", e);
    return false;
  }
}

// ======================================================
// ===== Telegram WebApp (fullscreen) =====
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

// ======================================================
// ===== Question pool (Restaurant/Cafe) — 30 =====
// correct всегда 0 (правильный вариант в options[0])
const QUESTION_POOL = [
  { word:"receipt", clue:"You get it after you pay. It shows what you ordered and the total price.", options:["receipt","menu","plate","kitchen"], correct:0 },
  { word:"reservation", clue:"You make it before coming to get a table at a specific time.", options:["reservation","recommendation","registration","resignation"], correct:0 },
  { word:"appetizer", clue:"A small dish you eat before the main course.", options:["appetizer","dessert","beverage","ingredient"], correct:0 },
  { word:"beverage", clue:"A drink you can order: water, tea, coffee, juice.", options:["beverage","menu","dessert","service"], correct:0 },
  { word:"waiter", clue:"This person takes your order and brings food to your table.", options:["waiter","visitor","writer","witness"], correct:0 },
  { word:"waitress", clue:"A woman who takes your order and serves food in a restaurant.", options:["waitress","waiter","witness","writer"], correct:0 },
  { word:"dessert", clue:"Sweet food you eat at the end of a meal.", options:["dessert","starter","salad","receipt"], correct:0 },
  { word:"ingredient", clue:"One of the foods used to make a dish.", options:["ingredient","instruction","increase","investment"], correct:0 },
  { word:"cashier", clue:"The person who takes your payment at the counter.", options:["cashier","chef","customer","cleaner"], correct:0 },
  { word:"takeaway", clue:"Food you order to eat somewhere else (not in the cafe).", options:["takeaway","takeover","takeoff","take care"], correct:0 },

  { word:"refill", clue:"When they fill your drink again with more coffee or water.", options:["refill","replace","reveal","repair"], correct:0 },
  { word:"service", clue:"How well the staff helps you in a restaurant.", options:["service","surface","server","servant"], correct:0 },
  { word:"customer", clue:"A person who buys food or drinks in a cafe.", options:["customer","consumer","costumer","client"], correct:0 },
  { word:"portion", clue:"The amount of food served to one person.", options:["portion","position","pattern","protein"], correct:0 },
  { word:"cutlery", clue:"Forks, knives, and spoons used for eating.", options:["cutlery","cuisine","cookery","cutlet"], correct:0 },
  { word:"napkin", clue:"A small piece of paper or cloth you use to clean your mouth or hands.", options:["napkin","newspaper","notebook","napalm"], correct:0 },
  { word:"counter", clue:"A long surface where you order or pay in a cafe.", options:["counter","country","counting","couch"], correct:0 },
  { word:"barista", clue:"A person who makes coffee drinks, especially espresso.", options:["barista","bartender","baker","banker"], correct:0 },
  { word:"espresso", clue:"A small, strong coffee made by forcing hot water through ground coffee.", options:["espresso","express","expensive","espressoo"], correct:0 },
  { word:"cappuccino", clue:"Coffee with steamed milk and foam.", options:["cappuccino","macchiato","milkshake","americano"], correct:0 },

  { word:"macchiato", clue:"An espresso with a small amount of milk or foam.", options:["macchiato","cappuccino","latte","mojito"], correct:0 },
  { word:"americano", clue:"Espresso with added hot water.", options:["americano","amaretto","american","macaroon"], correct:0 },
  { word:"latte", clue:"Coffee with a lot of milk, usually in a tall glass.", options:["latte","late","plate","latter"], correct:0 },
  { word:"kettle", clue:"A device used to boil water for tea.", options:["kettle","bottle","cattle","little"], correct:0 },
  { word:"allergy", clue:"A reaction some people have to certain foods (nuts, milk, etc.).", options:["allergy","energy","allegory","alligator"], correct:0 },
  { word:"gluten", clue:"A protein in wheat. Some people avoid it.", options:["gluten","glue","glitter","glutton"], correct:0 },
  { word:"spicy", clue:"Food that feels hot because of peppers or spices.", options:["spicy","species","spicey","spiky"], correct:0 },
  { word:"vegan", clue:"A person who eats no meat, fish, eggs, or dairy.", options:["vegan","vegetable","vagina","pescatarian"], correct:0 },
  { word:"checkout", clue:"The place or moment when you pay and finish your purchase.", options:["checkout","check in","check-up","check it"], correct:0 },
  { word:"complaint", clue:"When you say something is wrong and ask staff to fix it.", options:["complaint","complement","complex","complete"], correct:0 }
];

// ===== Game settings =====
const GAME_TOTAL_WORDS = 20;
const POOL_SIZE = 30;
const GAME_SECONDS = 120;
const MAX_HINTS = 3;

// scoring
const SCORE_FAST = 100;        // <5s
const SCORE_NORMAL = 60;       // >=5s
const PENALTY_HINT = 30;       // -30 once per hint use
const PENALTY_WRONG = 10;      // -10
const BONUS_FINISH = 200;      // all 20

// ===== State =====
let gameQuestions = [];
let qIndex = 0;
let score = 0;
let hintsLeft = MAX_HINTS;

let gameStartTs = 0;
let qStartTs = 0;

let timerInterval = null;
let countdownInterval = null;

const elMain = document.getElementById('main');

// ===== Helpers =====
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pickN(arr, n){
  return shuffle(arr).slice(0, n);
}
function nowMs(){ return Date.now(); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function formatMMSS(total){
  const m = Math.floor(total/60);
  const s = total%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function getRemainingSeconds(){
  const elapsed = Math.floor((nowMs() - gameStartTs)/1000);
  return clamp(GAME_SECONDS - elapsed, 0, GAME_SECONDS);
}

function clearAllIntervals(){
  if (timerInterval) clearInterval(timerInterval);
  if (countdownInterval) clearInterval(countdownInterval);
  timerInterval = null;
  countdownInterval = null;
}

// ===== Screens =====
function renderLobby(){
  clearAllIntervals();
  elMain.innerHTML = `
    <div class="page-label">Лобі</div>
    <div class="card glass">
      <div class="lobby">
        <div class="logo">⚡</div>
        <div class="h1">WORD RUSH</div>
        <div class="sub">Вгадай ${GAME_TOTAL_WORDS} слів за 2 хвилини</div>

        <div class="rules">
          <div class="rule">⏱ <span><b>2 хвилини</b> на всю гру</span></div>
          <div class="rule">📖 <span>Читай підказку — вибирай слово</span></div>
          <div class="rule">💡 <span>До <b>${MAX_HINTS} підказок</b> за гру</span></div>
          <div class="rule">⭐ <span>Швидша відповідь = <b>більше очок</b></span></div>
          <div class="rule">🏆 <span>Топ-5 оновлюється щомиті</span></div>
        </div>

        <button class="btn" id="btnStart">Почати гру →</button>
      </div>
    </div>
  `;
  document.getElementById('btnStart').addEventListener('click', renderCountdown);
}

function renderCountdown(){
  clearAllIntervals();
  elMain.innerHTML = `
    <div class="page-label">Приготуйся</div>
    <div class="card glass">
      <div class="countdown">
        <div class="small" style="margin-bottom:20px">Гра починається через</div>
        <div class="ring"><div class="big" id="cdNum">3</div></div>
        <div class="small" style="margin-top:16px;color:rgba(77,141,255,.75)">Приготуйся!</div>
      </div>
    </div>
  `;

  let n = 3;
  const elNum = document.getElementById('cdNum');

  const pop = () => {
    if (!elNum) return;
    elNum.style.animation = 'none';
    elNum.offsetHeight;
    elNum.style.animation = 'scalePop .35s cubic-bezier(.34,1.56,.64,1)';
    elNum.textContent = String(n);
  };
  pop();

  countdownInterval = setInterval(() => {
    n--;
    if (n === 0) {
      clearAllIntervals();
      startNewGame();
      return;
    }
    pop();
  }, 850);
}

// ===== Game logic =====
function startNewGame(){
  clearAllIntervals();

  const basePool = pickN(QUESTION_POOL, Math.min(POOL_SIZE, QUESTION_POOL.length));
  gameQuestions = pickN(basePool, GAME_TOTAL_WORDS);

  qIndex = 0;
  score = 0;
  hintsLeft = MAX_HINTS;

  gameStartTs = nowMs();
  qStartTs = nowMs();

  renderGameQuestion();
  startGlobalTimer();
}

function startGlobalTimer(){
  timerInterval = setInterval(() => {
    const left = getRemainingSeconds();
    updateTimerUI(left);
    if (left <= 0) finishGame(true);
  }, 250);
}

function updateTimerUI(secondsLeft){
  const elTimer = document.getElementById('timerVal');
  const elFill = document.getElementById('timerFill');
  if (!elTimer || !elFill) return;

  elTimer.textContent = formatMMSS(secondsLeft);
  const pct = (secondsLeft / GAME_SECONDS) * 100;
  elFill.style.width = `${pct}%`;

  if (secondsLeft <= 20) {
    elTimer.classList.add('urgent');
    elFill.classList.add('urgent');
  } else {
    elTimer.classList.remove('urgent');
    elFill.classList.remove('urgent');
  }
}

function buildLetterBoxes(word, revealedSet){
  const letters = word.toUpperCase().split('');
  const boxes = letters.map((ch, i) => {
    const isRevealed = revealedSet.has(i);
    const cls = isRevealed ? 'box hint' : 'box empty';
    const val = isRevealed ? ch : '_';
    return `<div class="${cls}" data-i="${i}">${val}</div>`;
  }).join('');
  return boxes;
}

function renderGameQuestion(){
  const q = gameQuestions[qIndex];
  const secondsLeft = getRemainingSeconds();

  const opts = q.options.slice();
  const correctText = opts[q.correct];
  const shuffled = shuffle(opts);
  const correctIdx = shuffled.indexOf(correctText);

  const revealed = new Set();

  elMain.innerHTML = `
    <div class="page-label">Слово ${qIndex+1} з ${GAME_TOTAL_WORDS}</div>
    <div class="card glass">
      <div class="game">
        <div class="toprow">
          <span class="counter">Слово ${qIndex+1} / ${GAME_TOTAL_WORDS}</span>
          <span class="timer" id="timerVal">${formatMMSS(secondsLeft)}</span>
        </div>
        <div class="bar"><div class="fill" id="timerFill" style="width:${(secondsLeft/GAME_SECONDS)*100}%"></div></div>

        <div style="margin-bottom:12px"><span class="badge">⭐ <span id="scoreVal">${score}</span> очок</span></div>

        <div class="clue">
          <div class="label">Підказка</div>
          <div class="text">${escapeHtml(q.clue)}</div>
        </div>

        <div class="word" id="wordBoxes">
          ${buildLetterBoxes(q.word, revealed)}
        </div>

        <div class="grid" id="optGrid">
          ${shuffled.map((t, i) => `<button class="opt" data-i="${i}">${escapeHtml(t)}</button>`).join('')}
        </div>

        <button class="hintbtn" id="hintBtn">${hintLabel()}</button>
      </div>
    </div>
  `;

  updateTimerUI(secondsLeft);

  const grid = document.getElementById('optGrid');
  grid.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      onPickOption(btn, Number(btn.dataset.i), correctIdx, revealed, q.word);
    });
  });

  const hintBtn = document.getElementById('hintBtn');
  hintBtn.addEventListener('click', () => {
    onUseHint(revealed, q.word);
  });

  qStartTs = nowMs();
}

function hintLabel(){
  return hintsLeft > 0 ? `Підказка (залишилось: ${hintsLeft})` : `Підказок немає`;
}

function onUseHint(revealed, word){
  if (hintsLeft <= 0) return;

  const len = word.length;
  const candidates = [];
  for (let i=0;i<len;i++){
    if (!revealed.has(i)) candidates.push(i);
  }
  if (candidates.length === 0) return;

  const idx = candidates[Math.floor(Math.random()*candidates.length)];
  revealed.add(idx);

  hintsLeft -= 1;
  score = Math.max(0, score - PENALTY_HINT);

  const boxes = document.getElementById('wordBoxes');
  boxes.innerHTML = buildLetterBoxes(word, revealed);
  document.getElementById('hintBtn').textContent = hintLabel();
  document.getElementById('scoreVal').textContent = String(score);
}

function onPickOption(btn, pickedIdx, correctIdx, revealed, word){
  document.querySelectorAll('.opt').forEach(b => b.classList.add('disabled'));

  const grid = document.getElementById('optGrid');
  const buttons = grid.querySelectorAll('.opt');

  const isCorrect = pickedIdx === correctIdx;

  if (isCorrect) {
    const dt = Math.floor((nowMs() - qStartTs)/1000);
    const add = (dt < 5) ? SCORE_FAST : SCORE_NORMAL;
    score += add;

    btn.classList.remove('disabled');
    btn.classList.add('correct');
    btn.textContent = btn.textContent + " ✓";

    showSolvedWord(word);

    setTimeout(() => {
      qIndex += 1;
      if (qIndex >= GAME_TOTAL_WORDS) finishGame(false);
      else renderGameQuestion();
    }, 700);

  } else {
    score = Math.max(0, score - PENALTY_WRONG);

    btn.classList.remove('disabled');
    btn.classList.add('wrong');

    setTimeout(() => {
      btn.classList.add('disabled');
      buttons.forEach((b, i) => {
        if (i !== pickedIdx) b.classList.remove('disabled');
      });
      document.getElementById('scoreVal').textContent = String(score);
    }, 500);
  }
}

function showSolvedWord(word){
  const letters = word.toUpperCase().split('');
  const html = letters.map(ch => `<div class="box correct">${ch}</div>`).join('');
  const boxes = document.getElementById('wordBoxes');
  if (boxes) boxes.innerHTML = html;
  document.getElementById('scoreVal').textContent = String(score);
}

async function finishGame(outOfTime){
  clearAllIntervals();

  const wordsSolved = outOfTime ? qIndex : GAME_TOTAL_WORDS;
  const secondsLeft = getRemainingSeconds();

  let finalScore = score;
  if (!outOfTime && wordsSolved === GAME_TOTAL_WORDS) finalScore += BONUS_FINISH;

  // Telegram identity
  const user = getTgUser();
  const displayName = getDisplayName(user);

  // 1) submit score
  const ok = await submitScore({
    round_id: ROUND_ID,
    user_id: user.id,
    username: (user.username ? ("@" + user.username) : displayName),
    score: finalScore
  });

  // 2) fetch top 5
  const top5 = await fetchTop5(ROUND_ID);

  elMain.innerHTML = `
    <div class="page-label">Підсумки</div>
    <div class="card glass">
      <div class="results">
        <div class="trophy">🏆</div>
        <div class="rtitle">${outOfTime ? "Час вийшов!" : "Чудова гра!"}</div>
        <div class="rsub">Ти вгадав ${wordsSolved} з ${GAME_TOTAL_WORDS} слів</div>

        <div class="stats">
          <div class="sbox"><div class="sval gold">${finalScore}</div><div class="slabel">ОЧОК</div></div>
          <div class="sbox"><div class="sval green">${wordsSolved}/${GAME_TOTAL_WORDS}</div><div class="slabel">СЛІВ</div></div>
          <div class="sbox"><div class="sval">${secondsLeft}s</div><div class="slabel">ЗАЛИШОК</div></div>
        </div>

        <div class="lb">
          <div class="ttl">Топ підписників (Round #${ROUND_ID})</div>
          ${top5.length ? top5.map((r, i) => `
            <div class="row">
              <span class="rank ${i<2 ? 'gold':''}">${i+1}</span>
              <span class="name">${escapeHtml(r.name)}</span>
              <span class="pts">${r.pts} pts</span>
            </div>
          `).join('') : `
            <div style="font-size:12px;color:rgba(200,215,255,.65);padding:6px 0;">
              ${ok ? "Поки що немає результатів." : "Не вдалося зберегти результат (перевір RLS політики/ключ)."}
            </div>
          `}
        </div>

        <button class="btn-green" id="btnAgain">Зіграти ще раз</button>
      </div>
    </div>
  `;

  document.getElementById('btnAgain').addEventListener('click', renderLobby);
}

// ===== tiny safe HTML escaper =====
function escapeHtml(str){
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

// start
renderLobby();
</script>
