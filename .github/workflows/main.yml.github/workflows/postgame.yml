name: Post Game Button

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests openai

      - name: Post game message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODE: postgame
          GROUP_CHAT_ID: "@Official_english_every_day"
          GAME_URL: "https://odessadry-gif.github.io/english-telegram-bot/"
          GAME_BUTTON_TEXT: "⚡ Word Rush"
          GAME_POST_TEXT: |
            ⚡ **Word Rush** — 2 хвилини на швидкий англійський челендж

            Вгадай 20 слів за 2 хвилини. Спробуй побити топ-5 👇
        run: python bot.py
