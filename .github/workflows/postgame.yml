name: Post Game Button

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests openai

      - name: Post game message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODE: postgame
          GROUP_CHAT_ID: "@Official_english_every_day"

          # ✅ Game (Travel Rush)
          GAME_URL: "https://odessadry-gif.github.io/english-telegram-bot/?v=3"
          GAME_BUTTON_TEXT: "✈️ Travel Rush"
          GAME_POST_TEXT: |
            ✈️ **Travel Rush** — швидкий тревел-квіз

            Вгадай 10 aviation та travel слів за 3 хвилини.
            Прокачай travel vocabulary 👇

        run: python bot.py
