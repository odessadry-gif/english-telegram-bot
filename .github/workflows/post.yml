name: Post English Quiz

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to post"
        required: false
        default: "quiz"
        type: choice
        options:
          - quiz
          - game_post
      game_url:
        description: "Mini game URL"
        required: false
        default: "https://odessadry-gif.github.io/english-telegram-bot/?tg=1"
      game_post_text:
        description: "Text for the game post"
        required: false
        default: "🎮 Перевір свій English\n\n120 коротких питань A2-B1:\n• живі фрази\n• кафе, подорожі, щоденні ситуації\n• трохи ідіом\n\n2 хвилини практики щодня."

permissions:
  contents: write

concurrency:
  group: post-english-quiz
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'quiz' }}
          GAME_URL: ${{ inputs.game_url || 'https://odessadry-gif.github.io/english-telegram-bot/?tg=1' }}
          GAME_POST_TEXT: ${{ inputs.game_post_text }}
        run: |
          python bot.py

      - name: Commit history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          test -f history.json || echo "[]" > history.json

          git add history.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update history [skip ci]"
          git push
